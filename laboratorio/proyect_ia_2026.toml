[project]
name = "iais-2024-25"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "contractions>=0.1.73",
    "fire==0.3.1",
    "gymnasium<1.0.0",
    "ipykernel>=7.1.0",
    "keras==3.0",
    "matplotlib>=3.10.8",
    "nltk>=3.9.2",
    "numpy<2",
    "pandas>=2.3.3",
    "py2pddl",
    "pyperplan>=2.1",
    "scikit-learn>=1.7.2",
    "torch==2.1.0",
    "torchvision>=0.16.0",
    "tqdm>=4.67.1",
    "unified-planning>=1.3.0",
    "up-fast-downward>=0.5.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
py2pddl = { git = "https://github.com/remykarem/py2pddl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
